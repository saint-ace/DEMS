openapi: 3.0.3
info:
  title: Digital Evidence Management System API
  version: 1.0.0
  description: REST API for the Digital Evidence Management System.
paths:
  /api/audit/:
    get:
      operationId: audit_list
      description: List audit logs.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: module
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit/{id}/:
    get:
